<section class="cookie-banner" aria-label="Cookie choices" tabindex="-1" hidden>
  <div class="wrap cookie-banner__inner">
    <div class="cookie-banner__text">
      <h2>Can we use cookies?</h2>
      <p>With your permission, we use Google Analytics cookies to see how people use this site. If you decline, they aren't set and you can still use the whole site. Read our <a href="{{ '/privacy/' | relative_url }}">privacy policy</a>.</p>
    </div>
    <div class="cookie-banner__actions">
      <button class="cookie-banner__button" type="button" data-cookie-choice="accepted">Accept</button>
      <button class="cookie-banner__button" type="button" data-cookie-choice="declined">Decline</button>
    </div>
  </div>
</section>
