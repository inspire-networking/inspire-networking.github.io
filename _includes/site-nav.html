<nav class="site-nav" aria-label="Main">
  <div class="site-nav__links">
    {% for item in site.data.navigation %}<a class="site-nav__link{% if page.nav == item.key %} is-current{% endif %}" href="{{ item.url | relative_url }}"{% if page.nav == item.key and page.layout != 'article' %} aria-current="page"{% endif %}>{{ item.label }}</a>
    {% endfor %}
  </div>
  <div class="site-nav__actions">
    <a class="site-nav__action site-nav__action--quiet" href="{{ site.data.settings.member_sign_in }}" target="_blank" rel="noopener">Sign in</a>
    <a class="site-nav__action site-nav__action--main" href="{{ '/contact-inspire/' | relative_url }}"{% if page.nav == 'contact' %} aria-current="page"{% endif %}>Contact us</a>
  </div>
</nav>
